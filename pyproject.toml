[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "alliance-duel-bot"
version = "0.1.0"
description = "Private-chat Telegram bot for Alliance Duel campaign messages."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "aiogram>=3.31,<4",
    "aiosqlite>=0.22,<1",
    "python-dotenv>=1.2.4,<2",
    "tzdata>=2025.2,<2027",
]

[tool.setuptools.packages.find]
where = ["src"]

